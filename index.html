<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrightGrid ERP</title>
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var drop = [];
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && key.indexOf('erp.theme.user.') === 0) drop.push(key);
          }
          drop.forEach(function (key) { localStorage.removeItem(key); });
          var theme = (localStorage.getItem('erp.theme') || '').trim().toLowerCase();
          var next = theme === 'dark' ? 'dark' : 'light';
          root.setAttribute('data-theme', next);
          if (theme !== next) localStorage.setItem('erp.theme', next);
        } catch (e) {
          root.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
